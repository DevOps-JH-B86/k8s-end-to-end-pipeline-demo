apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      imagePullSecrets:
        - name: docker-registry-secret
      containers:
        - name: my-app
          image: docker-repo.sk-devops.com/demo-python-app:v2
          ports:
            - containerPort: 5000
